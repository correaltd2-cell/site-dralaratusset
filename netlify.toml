[build]
  command = "pip install -r requirements.txt && python3 blog/gerar.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.13"
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/blog/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
